<!DOCTYPE html>
<html>
<head>
    <title>Image Colorization</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<h2>Image Colorization using Deep Learning</h2>

<form method="POST" enctype="multipart/form-data">
    <input type="file" name="image" required>
    <br><br>
    <button type="submit">Colorize Image</button>
</form>

{% if original_image and colorized_image %}
<div class="result">
    <div>
        <h3>Original Image</h3>
        <img src="{{ original_image }}" width="300">
    </div>

    <div>
        <h3>Colorized Image</h3>
        <img src="{{ colorized_image }}" width="300">
        <br><br>
        <a href="{{ colorized_image }}" download>
            <button>Download Colorized Image</button>
        </a>
    </div>
</div>
{% endif %}

</body>
</html>
